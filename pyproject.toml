[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name. The import package stays `termtosvg` (see [tool.setuptools]),
# and nothing in the code looks the distribution name up at runtime. The plain
# `termtosvg` name on PyPI belongs to the original author and serves 1.1.0, which
# cannot start on Python 3.12+.
name = "termtosvg-ng"
dynamic = ["version"]
description = "Record terminal sessions as lightweight SVG animations"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
# PEP 621 distinguishes the two roles: `authors` wrote the code, `maintainers`
# look after it now. PyPI renders both.
maintainers = [{ name = "Gabor Lepsenyi" }]
authors = [{ name = "Nicolas Bedos" }]
keywords = ["terminal", "recorder", "svg", "animation", "asciicast", "asciinema"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
dependencies = [
    "lxml",
    "pyte",
    "wcwidth",
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "ruff",
    "twine",
]

[project.scripts]
# Two names for one entry point. `termtosvg` is the historical command and keeps
# existing scripts, tutorials and distro packaging working; `termtosvg-ng` matches
# the name the package is installed under, so `pip install termtosvg-ng` followed
# by `termtosvg-ng` reads consistently. Help text adapts to whichever was used.
termtosvg = "termtosvg.main:main"
termtosvg-ng = "termtosvg.main:main"

[project.urls]
# These must resolve to the code this distribution actually ships, otherwise a
# user hitting a bug is sent to a repository that has been read-only since 2020.
Homepage = "https://gaborini.github.io/termtosvg/"
Source = "https://github.com/gaborini/termtosvg"
Changelog = "https://github.com/gaborini/termtosvg/blob/develop/CHANGELOG.md"
Issues = "https://github.com/gaborini/termtosvg/issues"
Maintainer = "https://gaborl.hu"

[tool.setuptools]
packages = ["termtosvg", "termtosvg.tests"]

[tool.setuptools.dynamic]
version = { attr = "termtosvg.__version__" }

[tool.setuptools.package-data]
termtosvg = ["data/*.dtd", "data/templates/*.svg"]

[tool.ruff]
line-length = 100
target-version = "py310"

# `ruff check` is enforced in CI; `ruff format` deliberately is not. Running the
# formatter over this codebase rewrites ~1800 lines, almost entirely converting
# single quotes to double quotes, which would bury real changes and destroy
# `git blame` history for no functional gain. Format new code to match its
# surroundings instead.

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = [
    # The SVG/terminal code paths legitimately shadow builtins such as `buffer`
    # and `format`; renaming them would churn the public helper signatures.
    "A002",
]

[tool.ruff.lint.per-file-ignores]
# Tests embed long expected-SVG literals that must not be reflowed.
"termtosvg/tests/*" = ["E501"]

[tool.coverage.run]
branch = true
source = ["termtosvg"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
