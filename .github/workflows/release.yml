name: Release

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions and manual pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="$(python -c 'import termtosvg; print(termtosvg.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match termtosvg.__version__ '$version'" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      # This step hung for over ten minutes during the first 1.3.0 attempt after
      # taking 16 seconds for 1.2.0, so it is now bounded and hardened against
      # the two plausible causes: apt blocking on the dpkg lock held by the
      # runner's unattended-upgrades, and pandoc's recommended packages dragging
      # in a large LaTeX tree. Failing fast beats hanging until the job limit.
      - name: Render manual pages
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends pandoc
          pandoc --version | head -1
          make man
          ls -l man/termtosvg*.man.* man_*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: manpages
          path: man_*.tar.gz

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing, which replaces the stored API
      # token the previous Travis pipeline carried in-repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Attach artifacts to the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: manpages
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: artifacts/

      # Without this the release body is empty: the action does not pick up the
      # tag annotation. Deriving the notes from CHANGELOG.md keeps them in step
      # with the changelog instead of being written twice.
      - name: Build release notes from the changelog
        run: |
          set -euo pipefail
          python - <<'PY' > release-notes.md
          import os, pathlib, re, sys

          version = os.environ["GITHUB_REF_NAME"]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          section = re.search(
              rf"^## Version {re.escape(version)}\b.*?\n(.*?)(?=^## Version |\Z)",
              changelog, re.S | re.M,
          )
          if section is None:
              sys.exit(f"CHANGELOG.md has no '## Version {version}' section")

          print("## Install\n")
          print("```shell")
          print("pip install termtosvg-ng")
          print("```\n")
          print("The distribution is named `termtosvg-ng`; the installed command and")
          print("the import package are both still `termtosvg`.\n")
          print("## Changes\n")
          print(section.group(1).strip())
          PY
          echo "--- generated notes ---"
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          # Left as a draft on purpose, matching the previous pipeline: a human
          # reviews the notes and assets before the release goes public.
          draft: true
          name: termtosvg ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
